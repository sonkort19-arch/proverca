<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Сообщение в голос</title>
  <style>
    :root {
      --bg: #0b0d10;
      --panel: #15191f;
      --panel-2: #1b2129;
      --text: #f5f7fa;
      --muted: #9aa5b1;
      --green: #34e27a;
      --green-dark: #20b95f;
      --danger: #ff5d6c;
      --border: rgba(255,255,255,.09);
      --shadow: 0 18px 60px rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(52,226,122,.15), transparent 30%),
        radial-gradient(circle at bottom right, rgba(52,226,122,.08), transparent 35%),
        var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: min(920px, 100%);
      background: rgba(21,25,31,.94);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-radius: 28px;
      overflow: hidden;
      backdrop-filter: blur(15px);
    }

    .header {
      padding: 28px 30px 18px;
      display: flex;
      gap: 16px;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--green), #8cffb5);
      display: grid;
      place-items: center;
      color: #07110b;
      font-size: 26px;
      font-weight: 900;
      box-shadow: 0 10px 30px rgba(52,226,122,.25);
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 38px);
      line-height: 1.05;
    }

    .subtitle {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .content {
      padding: 26px 30px 30px;
    }

    .field-label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      color: #dce3ea;
      font-weight: 700;
    }

    .counter {
      color: var(--muted);
      font-weight: 500;
      font-size: 13px;
    }

    textarea {
      width: 100%;
      min-height: 230px;
      resize: vertical;
      border: 1px solid var(--border);
      outline: none;
      border-radius: 20px;
      padding: 18px;
      background: var(--panel-2);
      color: var(--text);
      font-size: 18px;
      line-height: 1.55;
      transition: .2s;
    }

    textarea:focus {
      border-color: rgba(52,226,122,.7);
      box-shadow: 0 0 0 4px rgba(52,226,122,.10);
    }

    .grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      gap: 14px;
      margin-top: 18px;
    }

    .control {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
    }

    .control label {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 9px;
    }

    select {
      width: 100%;
      border: none;
      outline: none;
      border-radius: 12px;
      padding: 11px 12px;
      background: #11151a;
      color: var(--text);
      font-size: 15px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--green);
    }

    .value {
      color: var(--green);
      font-weight: 800;
      margin-left: 5px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    button {
      border: none;
      border-radius: 16px;
      padding: 15px 16px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 800;
      transition: transform .15s, opacity .15s, background .15s;
    }

    button:active { transform: scale(.98); }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .primary {
      background: linear-gradient(135deg, var(--green), #76ff9f);
      color: #08110b;
    }

    .secondary {
      background: #242b34;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .danger {
      background: rgba(255,93,108,.12);
      color: #ff7a87;
      border: 1px solid rgba(255,93,108,.25);
    }

    .status {
      margin-top: 18px;
      border-radius: 16px;
      padding: 14px 16px;
      color: var(--muted);
      background: rgba(255,255,255,.035);
      border: 1px solid var(--border);
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #65717e;
      flex: 0 0 auto;
    }

    .status.speaking .status-dot {
      background: var(--green);
      box-shadow: 0 0 0 7px rgba(52,226,122,.10);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      50% { transform: scale(1.35); }
    }

    .hint {
      margin-top: 15px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 760px) {
      body { padding: 12px; align-items: flex-start; }
      .app { border-radius: 22px; }
      .header, .content { padding-left: 18px; padding-right: 18px; }
      .grid { grid-template-columns: 1fr; }
      .buttons { grid-template-columns: 1fr 1fr; }
      textarea { min-height: 200px; font-size: 16px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="logo">🔊</div>
      <div>
        <h1>Сообщение в голос</h1>
        <p class="subtitle">Вставьте текст — приложение прочитает его вслух.</p>
      </div>
    </header>

    <section class="content">
      <div class="field-label">
        <span>Текст сообщения</span>
        <span class="counter"><span id="charCount">0</span> символов</span>
      </div>

      <textarea id="textInput" maxlength="10000" placeholder="Например: Здравствуйте! Ваш телефон готов, можете забрать его сегодня до 19:00."></textarea>

      <div class="grid">
        <div class="control">
          <label for="voiceSelect">Голос</label>
          <select id="voiceSelect">
            <option>Загрузка голосов...</option>
          </select>
        </div>

        <div class="control">
          <label for="rate">Скорость: <span class="value" id="rateValue">1.0</span></label>
          <input id="rate" type="range" min="0.5" max="2" value="1" step="0.1" />
        </div>

        <div class="control">
          <label for="pitch">Высота голоса: <span class="value" id="pitchValue">1.0</span></label>
          <input id="pitch" type="range" min="0.5" max="2" value="1" step="0.1" />
        </div>
      </div>

      <div class="buttons">
        <button class="primary" id="speakBtn">▶ Озвучить</button>
        <button class="secondary" id="pauseBtn">⏸ Пауза</button>
        <button class="secondary" id="resumeBtn">⏯ Продолжить</button>
        <button class="danger" id="stopBtn">■ Остановить</button>
      </div>

      <div class="status" id="status">
        <span class="status-dot"></span>
        <span id="statusText">Готово к работе</span>
      </div>

      <div class="hint">
        Приложение использует голоса, установленные в вашем браузере или телефоне.
        Для лучшей работы откройте файл в Google Chrome или Microsoft Edge.
      </div>
    </section>
  </main>

  <script>
    const textInput = document.getElementById('textInput');
    const voiceSelect = document.getElementById('voiceSelect');
    const rate = document.getElementById('rate');
    const pitch = document.getElementById('pitch');
    const rateValue = document.getElementById('rateValue');
    const pitchValue = document.getElementById('pitchValue');
    const charCount = document.getElementById('charCount');
    const speakBtn = document.getElementById('speakBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resumeBtn = document.getElementById('resumeBtn');
    const stopBtn = document.getElementById('stopBtn');
    const status = document.getElementById('status');
    const statusText = document.getElementById('statusText');

    let voices = [];
    let currentUtterance = null;

    function setStatus(message, speaking = false) {
      statusText.textContent = message;
      status.classList.toggle('speaking', speaking);
    }

    function loadVoices() {
      voices = window.speechSynthesis.getVoices();

      voiceSelect.innerHTML = '';

      if (!voices.length) {
        const option = document.createElement('option');
        option.textContent = 'Голоса не найдены';
        option.value = '';
        voiceSelect.appendChild(option);
        return;
      }

      const sortedVoices = [...voices].sort((a, b) => {
        const aRu = a.lang.toLowerCase().startsWith('ru') ? 0 : 1;
        const bRu = b.lang.toLowerCase().startsWith('ru') ? 0 : 1;
        return aRu - bRu || a.name.localeCompare(b.name);
      });

      sortedVoices.forEach((voice) => {
        const option = document.createElement('option');
        option.value = voices.indexOf(voice);
        option.textContent = `${voice.name} — ${voice.lang}${voice.default ? ' (по умолчанию)' : ''}`;
        voiceSelect.appendChild(option);
      });

      const russianIndex = voices.findIndex(v => v.lang.toLowerCase().startsWith('ru'));
      if (russianIndex >= 0) voiceSelect.value = russianIndex;
    }

    function speakText() {
      const text = textInput.value.trim();

      if (!text) {
        setStatus('Сначала введите текст');
        textInput.focus();
        return;
      }

      if (!('speechSynthesis' in window)) {
        setStatus('Ваш браузер не поддерживает озвучивание текста');
        return;
      }

      window.speechSynthesis.cancel();

      currentUtterance = new SpeechSynthesisUtterance(text);
      const selectedVoice = voices[Number(voiceSelect.value)];

      if (selectedVoice) {
        currentUtterance.voice = selectedVoice;
        currentUtterance.lang = selectedVoice.lang;
      } else {
        currentUtterance.lang = 'ru-RU';
      }

      currentUtterance.rate = Number(rate.value);
      currentUtterance.pitch = Number(pitch.value);
      currentUtterance.volume = 1;

      currentUtterance.onstart = () => setStatus('Сообщение озвучивается', true);
      currentUtterance.onpause = () => setStatus('Озвучивание на паузе');
      currentUtterance.onresume = () => setStatus('Озвучивание продолжается', true);
      currentUtterance.onend = () => setStatus('Озвучивание завершено');
      currentUtterance.onerror = (event) => {
        if (event.error !== 'canceled' && event.error !== 'interrupted') {
          setStatus('Не удалось воспроизвести голос');
        }
      };

      window.speechSynthesis.speak(currentUtterance);
    }

    speakBtn.addEventListener('click', speakText);

    pauseBtn.addEventListener('click', () => {
      if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
        window.speechSynthesis.pause();
      }
    });

    resumeBtn.addEventListener('click', () => {
      if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
      }
    });

    stopBtn.addEventListener('click', () => {
      window.speechSynthesis.cancel();
      setStatus('Озвучивание остановлено');
    });

    textInput.addEventListener('input', () => {
      charCount.textContent = textInput.value.length;
    });

    rate.addEventListener('input', () => {
      rateValue.textContent = Number(rate.value).toFixed(1);
    });

    pitch.addEventListener('input', () => {
      pitchValue.textContent = Number(pitch.value).toFixed(1);
    });

    if ('speechSynthesis' in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    } else {
      setStatus('Ваш браузер не поддерживает озвучивание текста');
      speakBtn.disabled = true;
    }

    window.addEventListener('beforeunload', () => {
      window.speechSynthesis.cancel();
    });
  </script>
</body>
</html>
